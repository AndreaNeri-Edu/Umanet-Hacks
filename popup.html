<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Umanet Hacks</title>
  <link rel="stylesheet" href="style/popup.css">
</head>
<body>
  <div class="app">
    
    <!-- Header Hero con Logo Protagonista -->
    <header class="header">
      <div class="logo-hero">
        <img src="icons/uma.png" alt="Umanet Logo" class="logo">
        <span class="dot-online"></span>
      </div>
      <div class="brand-meta">
        <h1 class="title">Umanet Hacks</h1>
        <span class="version">v2.2</span>
      </div>
    </header>

    <main class="content">
      
      <!-- Sezione Sfondo -->
      <section class="card">
        <div class="card-title">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          Sfondo Personalizzato
        </div>
        
        <div class="preview" id="preview">
          <div class="preview-empty">
            <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            <span>Carica un'immagine</span>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="choose">
            <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            Carica
          </button>
          <button type="button" class="btn btn-secondary" id="remove" disabled>
            <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Rimuovi
          </button>
        </div>
      </section>

      <!-- Sezione Moduli & Funzioni Future -->
      <section class="card">
        <div class="card-title">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Opzioni Interfaccia
        </div>

        <div class="options-list">
          <label class="option-row">
            <div class="option-info">
              <span class="label">Modalità compatta</span>
              <span class="sublabel">Riduci gli spazi della pagina</span>
            </div>
            <input type="checkbox" class="toggle" id="compact-view">
          </label>

          <label class="option-row">
            <div class="option-info">
              <span class="label">Nascondi banner</span>
              <span class="sublabel">Rimuovi gli avvisi non necessari</span>
            </div>
            <input type="checkbox" class="toggle" id="hide-alerts">
          </label>
        </div>
      </section>

    </main>

    <input type="file" id="file" accept="image/*">
    
    <footer class="footer">
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
